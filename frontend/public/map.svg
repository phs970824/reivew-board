<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 50 460 830" role="img" aria-label="대한민국 7개 권역 지역 선택 지도">
  <style>
    .region {
      stroke: #fff;
      stroke-width: 5;
      stroke-linejoin: round;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: filter .2s ease, transform .2s ease, opacity .2s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .region:hover,
    .region.active {
      filter: brightness(.88) drop-shadow(0 5px 7px rgba(0,0,0,.18));
      transform: scale(1.025);
    }
    .region:focus {
      outline: none;
    }
    .region:focus-visible {
      outline: 2px solid #ff6b00;
      outline-offset: 3px;
    }
    .label {
      pointer-events: none;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      font-size: 25px;
      font-weight: 700;
      fill: #222;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .seoul { fill:#ff5b4d; }
    .gyeonggi { fill:#ffb84d; }
    .gangwon { fill:#8ed16f; }
    .chungcheong { fill:#9b8cf5; }
    .jeolla { fill:#5fa8ed; }
    .gyeongsang { fill:#ffad68; }
    .jeju { fill:#52c7b5; }

    @media (prefers-reduced-motion: reduce) {
      .region { transition:none; }
    }
  </style>

  <!-- 서울 -->
  <path id="seoul" class="region seoul"
    d="M238 116
       C222 104 224 82 242 72
       C261 62 285 68 293 86
       C301 104 289 121 272 128
       C258 134 246 129 238 116 Z"
    tabindex="0" aria-label="서울"/>

