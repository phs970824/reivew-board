  <!-- 라벨 -->
  <text class="label" x="258" y="101">서울</text>
  <text class="label" x="253" y="224">경기</text>
  <text class="label" x="393" y="194">강원</text>
  <text class="label" x="239" y="354">충청</text>
  <text class="label" x="153" y="544">전라</text>
  <text class="label" x="374" y="525">경상</text>
  <text class="label" x="260" y="818">제주</text>

  <script><![CDATA[
    const regions = document.querySelectorAll('.region');
    regions.forEach(region => {
      region.addEventListener('click', () => {
        regions.forEach(r => r.classList.remove('active'));
        region.classList.add('active');
        document.dispatchEvent(new CustomEvent('regionSelect', {
          detail: { region: region.id }
        }));
      });
      region.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          region.click();
        }
      });
    });
  ]]></script>
</svg>
